<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Seguridad</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ============================================================
           RESET Y BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-card: #1a1a3a;
            --bg-card-hover: #22224a;
            --bg-input: #0d0d20;
            --border-color: #2a2a4a;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b8;
            --text-muted: #6a6a82;
            --accent-green: #4CAF50;
            --accent-red: #f44336;
            --accent-orange: #ff9800;
            --accent-blue: #2196F3;
            --accent-purple: #9C27B0;
            --accent-cyan: #00BCD4;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        /* Scrollbar personalizada */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-green);
        }

        /* ============================================================
           LOGIN
           ============================================================ */
        .login-container {
            max-width: 420px;
            margin: 80px auto;
            background: var(--bg-card);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .login-container .login-logo {
            text-align: center;
            font-size: 3em;
            margin-bottom: 10px;
        }

        .login-container h2 {
            text-align: center;
            font-size: 1.5em;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }

        .login-container .login-subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-bottom: 25px;
        }

        .login-container input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
            font-size: 1em;
            transition: var(--transition);
        }

        .login-container input:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
        }

        .login-container .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-green), #388E3C);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: var(--transition);
        }

        .login-container .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
        }

        .login-container .error {
            color: var(--accent-red);
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        /* ============================================================
           NAVBAR
           ============================================================ */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4em;
            font-weight: 700;
            color: #fff;
        }

        .navbar-brand .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-green), #1B5E20);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
        }

        .navbar-brand .brand-text {
            background: linear-gradient(135deg, #fff, var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .navbar-actions .server-clock {
            font-family: 'Courier New', monospace;
            font-size: 1.1em;
            color: var(--accent-green);
            background: rgba(76, 175, 80, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(76, 175, 80, 0.2);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85em;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        .status-dot.online { background: var(--accent-green); }
        .status-dot.offline { background: var(--accent-red); }
        .status-dot.warning { background: var(--accent-orange); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary { background: var(--accent-blue); color: #fff; }
        .btn-primary:hover { background: #1976D2; box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3); }

        .btn-success { background: var(--accent-green); color: #fff; }
        .btn-success:hover { background: #388E3C; box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3); }

        .btn-danger { background: var(--accent-red); color: #fff; }
        .btn-danger:hover { background: #D32F2F; box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3); }

        .btn-warning { background: var(--accent-orange); color: #fff; }
        .btn-warning:hover { background: #F57C00; box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3); }

        .btn-purple { background: var(--accent-purple); color: #fff; }
        .btn-purple:hover { background: #7B1FA2; box-shadow: 0 4px 15px rgba(156, 39, 176, 0.3); }

        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .btn-sm { padding: 5px 12px; font-size: 0.8em; }
        .btn-xs { padding: 3px 10px; font-size: 0.7em; }

        /* ============================================================
           TABS
           ============================================================ */
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 25px;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 6px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            padding: 10px 22px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 500;
            border-radius: 8px;
            transition: var(--transition);
        }

        .tab-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            color: #fff;
            background: linear-gradient(135deg, var(--accent-green), #1B5E20);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.2);
        }

        .tab-content {
            display: none;
            animation: fadeSlideIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           STATS CARDS
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 22px 20px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            border-radius: 0 4px 4px 0;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .stat-card .stat-icon {
            font-size: 1.8em;
            margin-bottom: 8px;
        }

        .stat-card .stat-label {
            font-size: 0.8em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .stat-card .stat-value {
            font-size: 2.2em;
            font-weight: 700;
            color: #fff;
            margin-top: 4px;
        }

        .stat-card .stat-change {
            font-size: 0.8em;
            margin-top: 6px;
        }

        .stat-card.green::before { background: var(--accent-green); }
        .stat-card.red::before { background: var(--accent-red); }
        .stat-card.orange::before { background: var(--accent-orange); }
        .stat-card.blue::before { background: var(--accent-blue); }
        .stat-card.purple::before { background: var(--accent-purple); }
        .stat-card.cyan::before { background: var(--accent-cyan); }

        /* ============================================================
           CARDS GENÉRICAS
           ============================================================ */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 25px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            transition: var(--transition);
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .card-header h3 {
            font-size: 1.1em;
            color: #fff;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header h3 i {
            color: var(--accent-green);
        }

        /* ============================================================
           TABLAS
           ============================================================ */
        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
        }

        thead {
            background: var(--bg-secondary);
        }

        th {
            text-align: left;
            padding: 14px 18px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 12px 18px;
            border-bottom: 1px solid rgba(42, 42, 74, 0.5);
            color: var(--text-primary);
            font-size: 0.95em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-success { background: rgba(76, 175, 80, 0.2); color: var(--accent-green); }
        .badge-danger { background: rgba(244, 67, 54, 0.2); color: var(--accent-red); }
        .badge-warning { background: rgba(255, 152, 0, 0.2); color: var(--accent-orange); }
        .badge-info { background: rgba(33, 150, 243, 0.2); color: var(--accent-blue); }
        .badge-purple { background: rgba(156, 39, 176, 0.2); color: var(--accent-purple); }

        .badge-running { background: rgba(76, 175, 80, 0.2); color: var(--accent-green); }
        .badge-stopped { background: rgba(244, 67, 54, 0.2); color: var(--accent-red); }

        /* Event levels */
        .event-info { color: var(--accent-blue); }
        .event-warning { color: var(--accent-orange); }
        .event-error { color: var(--accent-red); }

        .event-module {
            background: var(--bg-secondary);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            color: var(--text-secondary);
        }

        /* ============================================================
           MÓDULOS Y AGENTES (Grid)
           ============================================================ */
        .modules-grid, .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .module-card, .agent-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .module-card::before, .agent-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
        }

        .module-card.running::before { background: var(--accent-green); }
        .module-card.stopped::before { background: var(--accent-red); }

        .module-card:hover, .agent-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .module-header, .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .module-name, .agent-name {
            font-size: 1.1em;
            font-weight: 600;
            color: #fff;
        }

        .module-status {
            font-size: 0.8em;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .module-card.running .module-status {
            background: rgba(76, 175, 80, 0.2);
            color: var(--accent-green);
        }

        .module-card.stopped .module-status {
            background: rgba(244, 67, 54, 0.2);
            color: var(--accent-red);
        }

        .module-actions {
            margin-top: 15px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ============================================================
           FORMULARIOS
           ============================================================ */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-size: 0.9em;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
            font-size: 0.95em;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.15);
        }

        .form-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .form-row .form-group {
            flex: 1;
            min-width: 180px;
        }

        /* ============================================================
           RESULT BOX
           ============================================================ */
        .result-box {
            background: var(--bg-input);
            padding: 16px;
            border-radius: 8px;
            margin-top: 12px;
            border-left: 4px solid var(--accent-green);
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
            word-break: break-all;
            color: var(--text-secondary);
            max-height: 300px;
            overflow-y: auto;
        }

        /* ============================================================
           CONFIG SECTION
           ============================================================ */
        .config-section {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .config-section h3 {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 1.05em;
        }

        .config-section .running-badge {
            font-size: 0.8em;
            padding: 4px 14px;
            border-radius: 20px;
            background: var(--bg-card);
            color: var(--text-secondary);
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: var(--bg-card);
            padding: 35px;
            border-radius: var(--radius);
            width: 90%;
            max-width: 520px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 1.2em;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ============================================================
           FILTROS
           ============================================================ */
        .filter-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-controls #current-filter {
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        /* ============================================================
           LOADING / EMPTY
           ============================================================ */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: var(--text-secondary);
            gap: 12px;
        }

        .loading::after {
            content: '';
            width: 24px;
            height: 24px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-secondary);
        }

        .empty-state .icon {
            font-size: 3em;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 1024px) {
            body { padding: 15px; }
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 768px) {
            body { padding: 10px; }

            .navbar {
                flex-direction: column;
                align-items: stretch;
                padding: 15px;
            }

            .navbar-actions {
                justify-content: center;
                flex-wrap: wrap;
            }

            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .modules-grid, .agents-grid { grid-template-columns: 1fr; }

            .tabs {
                overflow-x: auto;
                flex-wrap: nowrap;
                gap: 2px;
                padding: 4px;
            }

            .tab-btn {
                padding: 8px 14px;
                font-size: 0.8em;
                white-space: nowrap;
            }

            .form-row { flex-direction: column; }
            .form-row .form-group { min-width: unset; }

            .card { padding: 18px; }
            .modal-content { padding: 25px; }

            .login-container { margin: 40px 15px; padding: 25px; }
        }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }

            .navbar-brand { font-size: 1.1em; }
            .navbar-brand .brand-icon { width: 32px; height: 32px; font-size: 1em; }

            .server-clock { font-size: 0.9em; padding: 4px 10px; }
            .status-indicator { font-size: 0.75em; padding: 4px 10px; }
            .btn { padding: 6px 14px; font-size: 0.8em; }

            th, td { padding: 8px 12px; font-size: 0.85em; }
            .badge { font-size: 0.65em; padding: 2px 10px; }
        }

        /* ============================================================
           TOAST (notificaciones)
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            padding: 14px 24px;
            border-radius: 10px;
            color: #fff;
            font-size: 0.9em;
            font-weight: 500;
            animation: slideInRight 0.4s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            min-width: 250px;
            max-width: 400px;
        }

        .toast-success { background: var(--accent-green); }
        .toast-error { background: var(--accent-red); }
        .toast-warning { background: var(--accent-orange); }
        .toast-info { background: var(--accent-blue); }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .toast.removing {
            animation: slideOutRight 0.3s ease forwards;
        }

        @keyframes slideOutRight {
            to {
                opacity: 0;
                transform: translateX(100px);
            }
        }

           ============================================================ */

        .text-muted { color: var(--text-muted); }
        .mt-10 { margin-top: 10px; }
        .mt-20 { margin-top: 20px; }
        .mb-10 { margin-bottom: 10px; }
        .mb-20 { margin-bottom: 20px; }
        .flex { display: flex; }
        .flex-center { display: flex; align-items: center; justify-content: center; }

<body>
    <div id="app"></div>

    <script>
        // ============================================================
        //  VARIABLES GLOBALES
        // ============================================================
        let agents = [];

        let events = [];
        let anomalies = [];
        let currentTab = 'dashboard';
        let token = null;
        let partialToken = null;
        let currentAgentFilter = null;
        let clockInterval = null;
        let dataInterval = null;

        // ============================================================
        //  UTILIDADES
        // ============================================================
        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function stopAllIntervals() {
            if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
            if (dataInterval) { clearInterval(dataInterval); dataInterval = null; }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer') || (() => {
                const c = document.createElement('div');
                c.className = 'toast-container';
                c.id = 'toastContainer';
                document.body.appendChild(c);
                return c;
            })();

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('removing');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function showModal(title, message, callback) {
            const modal = document.getElementById('customModal');
            if (!modal) {
                const div = document.createElement('div');
                div.className = 'modal';
                div.id = 'customModal';
                div.innerHTML = `
                    <div class="modal-content">
                        <h3 id="modalTitle">${title}</h3>
                        <p id="modalMessage">${message}</p>
                        <div class="modal-actions">
                            <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
                            <button class="btn btn-primary" id="modalConfirmBtn">Confirmar</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(div);
            }

            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('modalConfirmBtn').onclick = () => {
                closeModal();
                if (callback) callback();
            };
            document.getElementById('customModal').classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            if (modal) modal.classList.remove('active');
        }

        // Cerrar modal con ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ============================================================
        //  FETCH CON AUTENTICACIÓN
        // ============================================================
        async function fetchWithAuth(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json',
                    ...(options.headers || {})
                }
            });

            if (res.status === 403 || res.status === 401) {
                stopAllIntervals();
                renderLogin('Sesión expirada. Inicia sesión nuevamente.');
                throw new Error('No autorizado');
            }
            return res;
        }

        // ============================================================
        //  RELOJ DEL SERVIDOR
        // ============================================================
        async function updateServerClock() {
            try {
                const res = await fetchWithAuth('/api/server-time');
                if (!res.ok) return;
                const data = await res.json();
                const el = document.getElementById('server-clock');
                if (el) el.textContent = new Date(data.time).toLocaleTimeString();
            } catch (e) {
                console.error('Error obteniendo hora:', e);
            }
        }

        function startServerClock() {
            if (clockInterval) clearInterval(clockInterval);
            updateServerClock();
            clockInterval = setInterval(updateServerClock, 1000);
        }

        function stopServerClock() {
            if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
            const el = document.getElementById('server-clock');
            if (el) el.textContent = '--:--:--';
        }

        // ============================================================
        //  LOGIN
        // ============================================================
        function renderLogin(errorMsg = '') {
            stopAllIntervals();
            document.getElementById('app').innerHTML = `
                <div class="login-container">
                    <div class="login-logo">🛡️</div>
                    <h2>Centro de Seguridad</h2>
                    <p class="login-subtitle">Acceso al panel de control</p>
                    ${errorMsg ? `<div class="error">${errorMsg}</div>` : ''}
                    <input type="text" id="username" placeholder="Usuario" autocomplete="off">
                    <input type="password" id="password" placeholder="Contraseña">
                    <button class="login-btn" onclick="login()">
                        <i class="fas fa-sign-in-alt"></i> Ingresar
                    </button>
                </div>
            `;
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            try {
                const res = await fetch('/login', { method: 'POST', body: formData, credentials: 'include' });
                const data = await res.json();

                if (res.ok) {
                    if (data.requires_2fa) {
                        partialToken = data.partial_token;
                        show2FAInput();
                    } else {
                        renderDashboard();
                        startServerClock();
                        loadAgents();
                        loadEvents();
                        loadModules();
                        showToast('Bienvenido, ' + username, 'success');
                    }
                } else {
                    renderLogin(data.detail || 'Error de autenticación');
                }
            } catch (e) {
                renderLogin('Error de conexión');
            }
        }

        function logout() {
            stopAllIntervals();
            fetch('/logout', { method: 'POST', credentials: 'include' }).finally(() => {
                renderLogin();
            });
        }

        function show2FAInput() {
            stopAllIntervals();

        async function verify2FALogin() {
            const code = document.getElementById('2fa-code').value;
            const formData = new FormData();
            formData.append('partial_token', partialToken);
            formData.append('code', code);

            try {
                const res = await fetch('/api/2fa/verify', { method: 'POST', body: formData });
                if (res.ok) {
                    partialToken = null;
                    renderDashboard();
                    startServerClock();
                    loadAgents();
                    loadEvents();
                    loadModules();
                    showToast('Autenticación exitosa', 'success');
                } else {
                    const data = await res.json();
                    showToast(data.detail || 'Código incorrecto', 'error');
                    show2FAInput();
                }
            } catch (e) {
                showToast('Error de conexión', 'error');
            }
        }

        function goToAdminPanel() {

        // ============================================================
        //  TABS
        // ============================================================
        function showTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            const btn = document.querySelector(`.tab-btn[onclick*="${tabId}"]`);
            if (btn) btn.classList.add('active');

            const el = document.getElementById(tabId);
            if (el) el.classList.add('active');

            // Cargar contenido según tab
            const loaders = {
                'agents': loadAgents,
                'modules': loadModules,
                'dashboard': () => { loadAgents(); loadEvents(); updateStats(); },
                '2fa': load2FAStatus,
                'config': loadConfigModules,
                'ai': loadAIAnomalies,
                'passwords': loadPasswords
            };

            if (loaders[tabId]) loaders[tabId]();
        }

        // ============================================================
        //  STATS
        // ============================================================
        function updateStats() {
            // Agentes activos
            const activeAgents = agents.filter(a => a.status === 'online').length;
            document.getElementById('statAgents').textContent = activeAgents;

            // Módulos activos
            const activeModules = Object.values(modules).filter(m => m.running).length;
            document.getElementById('statModules').textContent = activeModules;

            // Alertas (eventos de nivel error y warning)
            const alerts = events.filter(e => e.level === 'error' || e.level === 'warning').length;
            document.getElementById('statAlerts').textContent = alerts;

            // Anomalías
            document.getElementById('statAnomalies').textContent = anomalies.length;
        }

        // ============================================================
        //  MÓDULOS
        // ============================================================
        async function loadModules() {
            try {
                const res = await fetchWithAuth('/api/modules');
                modules = await res.json();
                renderModules();
            } catch (e) { console.error(e); }
        }

        function renderModules() {
            const grid = document.getElementById('modules-grid');
            if (!grid) return;

            if (Object.keys(modules).length === 0) {

        function buildConfigFormFields(config, moduleName) {
            if (!config || typeof config !== 'object') return '<p class="text-muted">No hay configuración disponible</p>';

            return Object.entries(config).map(([key, value]) => {
                const fieldId = `config-${moduleName}-${key}`;
                let inputHtml = '';

                if (typeof value === 'boolean') {
                    inputHtml = `<input type="checkbox" id="${fieldId}" ${value ? 'checked' : ''}>`;
                } else if (typeof value === 'number') {
                    inputHtml = `<input type="number" id="${fieldId}" value="${escapeHtml(value)}" step="any">`;
                } else if (Array.isArray(value)) {
                    inputHtml = `<textarea id="${fieldId}" rows="3" placeholder="Un elemento por línea">${escapeHtml(value.join('\n'))}</textarea>`;
                } else if (typeof value === 'object' && value !== null) {
                    inputHtml = `<textarea id="${fieldId}" rows="3">${escapeHtml(JSON.stringify(value, null, 2))}</textarea>`;
                } else {
                    inputHtml = `<input type="text" id="${fieldId}" value="${escapeHtml(String(value))}">`;
                }

                return `
                    <div class="form-group">
                        <label for="${fieldId}">${escapeHtml(key)}</label>
                        ${inputHtml}
                    </div>
                `;
            }).join('');
        }

        async function saveConfig(moduleName) {
            const form = document.getElementById(`config-form-${moduleName}`);
            const inputs = form.querySelectorAll('input, textarea, select');
            const newConfig = {};

            for (let input of inputs) {
                const key = input.id.replace(`config-${moduleName}-`, '');
                let value;

                if (input.type === 'checkbox') {
                    value = input.checked;
                } else if (input.type === 'number') {
                    value = parseFloat(input.value) || 0;
                } else if (input.tagName === 'TEXTAREA') {
                    try {
                        if (input.value.includes('\n') && !input.value.trim().startsWith('{') && !input.value.trim().startsWith('[')) {
                            value = input.value.split('\n').map(s => s.trim()).filter(s => s !== '');
                        } else {
                            value = JSON.parse(input.value);
                        }
                    } catch {
                        value = input.value;
                    }
                } else {
                    value = input.value;
                }
                newConfig[key] = value;
            }

            try {
                const res = await fetchWithAuth(`/api/modules/${moduleName}/configure`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newConfig)
                });

                if (res.ok) {
                    showToast(`Configuración de ${moduleName} guardada`, 'success');
                    loadConfigModules();
                } else {
                    showToast('Error al guardar configuración', 'error');
                }
            } catch (e) {
                showToast('Error de conexión', 'error');
            }
        }

        async function importPasswords() {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = '.enc';
            fileInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const data = ev.target.result;
                    const password = prompt('Contraseña de importación:');
                    if (!password) return;

                    const formData = new FormData();
                    formData.append('data', data);
                    formData.append('password', password);

                    try {
                        await fetchWithAuth('/api/passwords/import', { method: 'POST', body: formData });
                        showToast('Importación exitosa', 'success');
                        loadPasswords();
                    } catch (err) {
                        showToast('Error al importar', 'error');
                    }
                };
                reader.readAsText(file);
            };
            fileInput.click();
        }

        // ============================================================
        //  COMANDOS A AGENTES
        // ============================================================
        function openCommandModal(agentId) {
            document.getElementById('modalAgentId').value = agentId;
            document.getElementById('commandModal').classList.add('active');
        }

        async function sendCommand() {
            const agentId = document.getElementById('modalAgentId').value;
            const action = document.getElementById('modalAction').value;
            const module = document.getElementById('modalModule').value;
            const config = document.getElementById('modalConfig').value;

            if (!module) {
                showToast('Especifica un módulo', 'warning');
                return;
            }

            const command = { action, module };
            if (action === 'configure' && config) {
                try {
                    command.config = JSON.parse(config);
                } catch {
                    showToast('Configuración JSON inválida', 'error');
                    return;
                }
            }

            try {
                const res = await fetchWithAuth(`/agents/${agentId}/command`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(command)
                });

                if (res.ok) {
                    showToast('Comando enviado al agente', 'success');
                    closeModal();
                } else {
                    showToast('Error al enviar comando', 'error');
                }
            } catch (e) {
                showToast('Error de conexión', 'error');
            }
        }

        // Cerrar modal de comandos con ESC o click fuera
        document.addEventListener('click', (e) => {
            const modal = document.getElementById('commandModal');
            if (e.target === modal) closeModal();
        });

        // ============================================================
        //  INICIALIZACIÓN
        // ============================================================
        window.onload = async () => {
            try {
                const res = await fetch('/api/user/me', { credentials: 'include' });
                if (res.ok) {
                    renderDashboard();
                    startServerClock();
                    loadAgents();
                    loadEvents();
                    loadModules();

                    // Actualizar datos periódicamente
                    dataInterval = setInterval(() => {
                        if (currentTab === 'dashboard') {
                            loadAgents();
                            loadEvents();
                            updateStats();
                        }
                    }, 5000);
                } else {
                    renderLogin();
                }
            } catch (e) {
                renderLogin();
            }
        };
    </script>
</body>
</html>
